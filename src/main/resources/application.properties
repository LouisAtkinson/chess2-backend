# Server
server.port=8080

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chessdb}
spring.datasource.username=${DATABASE_USERNAME:chess}
spring.datasource.password=${DATABASE_PASSWORD:chess}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# APIs
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.stockfish.api-url=${STOCKFISH_API_URL:https://stockfish.online/api/s/v2.php}

# Rate limiting
app.rate-limit.requests-per-minute=60

# Logging
logging.level.com.chess=INFO
logging.level.org.springframework.security=WARN
