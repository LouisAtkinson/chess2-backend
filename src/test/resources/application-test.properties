spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/chessdb_test}
spring.datasource.username=${DATABASE_USERNAME:chess}
spring.datasource.password=${DATABASE_PASSWORD:chess}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000
app.frontend.url=http://localhost:5173
app.mail.enabled=false
app.mail.from=test@test.com
app.stockfish.api-url=https://stockfish.online/api/s/v2.php
